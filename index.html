<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sawt · صوت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#050806;--surface:#0d130f;--s2:#16201a;--ink:#e9f5ec;--soft:#8fa598;--line:#1f2e25;--accent:#22c55e;--ai:#03140a;--danger:#f87171;--f:"IBM Plex Sans Arabic",system-ui,sans-serif;--fd:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f);padding-bottom:130px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:auto;padding:0 16px;padding-inline:max(16px,env(safe-area-inset-left,0px))}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 0;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brand{font:600 1.7rem var(--fd)}.brand i{color:var(--accent);font-style:normal}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:99px;cursor:pointer;font-weight:500;text-align:center}
.btn:hover{background:var(--s2)}.btn.p,.btn.on{background:var(--accent);border-color:var(--accent);color:var(--ai)}.btn.p:hover{filter:brightness(1.1)}
.btn.sm{padding:3px 12px;font-size:.8125rem}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.5}
.hero{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;background:radial-gradient(circle at 100% 0,#0f3d1f 0,var(--surface) 55%);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:24px}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.cov{aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:#fff;font:600 3.5rem var(--fd);background:linear-gradient(135deg,hsl(var(--h) 70% 30%),hsl(calc(var(--h) + 25) 65% 14%))}
.cov img{width:100%;height:100%;object-fit:cover}
.tag{font-size:.75rem;letter-spacing:.08em;color:var(--accent);font-weight:600;text-transform:uppercase}
.hero h1{font:600 1.7rem/1.3 var(--fd);margin:4px 0 8px}
.hero p{margin:0 0 14px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero.full p{-webkit-line-clamp:unset;white-space:pre-wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.bar h2{font:600 1.3rem var(--fd);margin:0;flex:1}
.bar input{width:min(220px,50%);border-radius:99px;padding-inline:14px}
.ep{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:16px;cursor:pointer;border:1px solid transparent}
.ep:hover{background:var(--surface)}.ep.now{background:var(--surface);border-color:var(--accent)}
.ep .cov{font-size:1.5rem;border-radius:12px}.ep h3{margin:0;font-size:1rem;line-height:1.4}
.meta{color:var(--soft);font-size:.8125rem}
.pb{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--ai);cursor:pointer}
.empty{text-align:center;color:var(--soft);padding:40px 0}
.box{display:grid;gap:12px;max-width:400px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.box h2,.sec h2{font-family:var(--fd);margin:0}.box label,.sec label{display:grid;gap:3px;font-size:.8125rem;color:var(--soft)}
.box input,.sec input:not([type=file]),.sec textarea,textarea{width:100%}
.msg{min-height:1.3em;font-size:.875rem;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat b{display:block;font:600 1.6rem var(--fd);color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:20px;display:grid;gap:10px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}.li:last-child{border:0}
.li>span{min-width:0;overflow-wrap:anywhere}
.cm{padding:10px 0;border-bottom:1px solid var(--line)}.cm p{margin:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
#pl{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
#pl[hidden]{display:none}.pi{max-width:900px;margin:auto;display:grid;gap:6px}
.pr{display:flex;align-items:center;gap:6px}.pr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pr button{border:0;background:var(--s2);border-radius:99px;padding:4px 10px;cursor:pointer}
#pp{background:var(--accent);color:var(--ai);width:44px;height:44px;padding:0;font-size:1.1rem}
.sk{display:flex;align-items:center;gap:10px;font-size:.75rem;color:var(--soft);direction:ltr}#seek{flex:1;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap"><header id="hdr"></header><main id="app"></main></div>
<div id="pl" hidden><div class="pi">
  <div class="pr"><button id="pp" aria-label="play">▶</button><span class="t" id="pt"></span>
  <button id="b15">−15</button><button id="f30">+30</button><button id="spd">1×</button><button id="slp" title="Sleep">🌙</button><button id="share">🔗</button></div>
  <div class="sk"><span id="tc">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0"><span id="td">0:00</span></div>
</div></div>
<audio id="au" preload="metadata"></audio>

<script>
const CONFIG={URL:"https://oetsulytfzxadvnfsdxj.supabase.co",KEY:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ldHN1bHl0Znp4YWR2bmZzZHhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMjk3MDksImV4cCI6MjEwODcwNTcwOX0.nVkB7YR0rNg2CYQ3IEhWbN3FJE8QV6ibovdH2DDLRJw"};
const T={
ar:{latest:"أحدث حلقة",all:"كل الحلقات",search:"ابحث…",none:"لا توجد حلقات.",listen:"استمع الآن",plays:"استماع",login:"تسجيل الدخول",signup:"إنشاء حساب",logout:"خروج",dash:"لوحة التحكم",email:"البريد الإلكتروني",pass:"كلمة المرور (6 أحرف فأكثر)",name:"الاسم",haveAcc:"لديك حساب؟",noAcc:"ليس لديك حساب؟",comments:"التعليقات",addC:"اكتب تعليقًا…",send:"إرسال",needLogin:"سجّل الدخول للإعجاب والتعليق.",del:"حذف",back:"رجوع",newEp:"حلقة جديدة",title:"العنوان",desc:"الوصف",audio:"ملف الصوت",cover:"الغلاف (اختياري)",publish:"نشر",up:"جارٍ الرفع…",done:"تم ✓",draft:"مسودة",live:"منشورة",sEps:"الحلقات",sPlays:"الاستماع",sLikes:"الإعجابات",sComm:"التعليقات",sUsers:"المستخدمون",mod:"آخر التعليقات",manage:"إدارة الحلقات",err:"خطأ: ",confirm:"تحقق من بريدك لتفعيل الحساب ثم سجّل الدخول.",noC:"لا تعليقات بعد.",cfg:"ضع رابط Supabase والمفتاح في CONFIG."},
en:{latest:"Latest episode",all:"All episodes",search:"Search…",none:"No episodes yet.",listen:"Listen now",plays:"plays",login:"Log in",signup:"Sign up",logout:"Log out",dash:"Dashboard",email:"Email",pass:"Password (6+ characters)",name:"Name",haveAcc:"Already have an account?",noAcc:"No account yet?",comments:"Comments",addC:"Write a comment…",send:"Send",needLogin:"Log in to like and comment.",del:"Delete",back:"Back",newEp:"New episode",title:"Title",desc:"Description",audio:"Audio file",cover:"Cover (optional)",publish:"Publish",up:"Uploading…",done:"Done ✓",draft:"Draft",live:"Live",sEps:"Episodes",sPlays:"Plays",sLikes:"Likes",sComm:"Comments",sUsers:"Users",mod:"Latest comments",manage:"Manage episodes",err:"Error: ",confirm:"Check your email to confirm, then log in.",noC:"No comments yet.",cfg:"Set the Supabase URL and key in CONFIG."},
fr:{latest:"Dernier épisode",all:"Tous les épisodes",search:"Rechercher…",none:"Aucun épisode.",listen:"Écouter",plays:"écoutes",login:"Connexion",signup:"Créer un compte",logout:"Déconnexion",dash:"Tableau de bord",email:"E-mail",pass:"Mot de passe (6 caractères min.)",name:"Nom",haveAcc:"Déjà un compte ?",noAcc:"Pas encore de compte ?",comments:"Commentaires",addC:"Écrire un commentaire…",send:"Envoyer",needLogin:"Connectez-vous pour aimer et commenter.",del:"Supprimer",back:"Retour",newEp:"Nouvel épisode",title:"Titre",desc:"Description",audio:"Fichier audio",cover:"Pochette (facultatif)",publish:"Publier",up:"Envoi…",done:"Terminé ✓",draft:"Brouillon",live:"Publié",sEps:"Épisodes",sPlays:"Écoutes",sLikes:"J’aime",sComm:"Commentaires",sUsers:"Utilisateurs",mod:"Derniers commentaires",manage:"Gérer les épisodes",err:"Erreur : ",confirm:"Vérifiez votre e-mail pour confirmer, puis connectez-vous.",noC:"Aucun commentaire.",cfg:"Renseignez l’URL et la clé Supabase dans CONFIG."},
es:{latest:"Último episodio",all:"Todos los episodios",search:"Buscar…",none:"Aún no hay episodios.",listen:"Escuchar",plays:"reproducciones",login:"Iniciar sesión",signup:"Crear cuenta",logout:"Salir",dash:"Panel",email:"Correo",pass:"Contraseña (mín. 6 caracteres)",name:"Nombre",haveAcc:"¿Ya tienes cuenta?",noAcc:"¿Aún no tienes cuenta?",comments:"Comentarios",addC:"Escribe un comentario…",send:"Enviar",needLogin:"Inicia sesión para dar me gusta y comentar.",del:"Eliminar",back:"Volver",newEp:"Nuevo episodio",title:"Título",desc:"Descripción",audio:"Archivo de audio",cover:"Portada (opcional)",publish:"Publicar",up:"Subiendo…",done:"Listo ✓",draft:"Borrador",live:"Publicado",sEps:"Episodios",sPlays:"Reproducciones",sLikes:"Me gusta",sComm:"Comentarios",sUsers:"Usuarios",mod:"Últimos comentarios",manage:"Gestionar episodios",err:"Error: ",confirm:"Revisa tu correo para confirmar y luego inicia sesión.",noC:"Aún no hay comentarios.",cfg:"Configura la URL y la clave de Supabase en CONFIG."}};
const LN={ar:"العربية",en:"English",fr:"Français",es:"Español"};
const $=i=>document.getElementById(i),au=$("au"),app=$("app");
const store={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let lang=store.get("sawt.lang");if(!T[lang])lang=T[(navigator.language||"").slice(0,2)]?navigator.language.slice(0,2):"ar";
const t=k=>T[lang][k]||T.en[k]||k;let nf;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=s=>{s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const date=d=>new Date(d).toLocaleDateString(lang,{year:"numeric",month:"long",day:"numeric"});
let sb,session,profile,isAdmin=false,eps=[],likes=[],cc=[],cur=null,counted={},query="";
const pub=p=>sb.storage.from("podcast").getPublicUrl(p).data.publicUrl;
const hue=s=>120+[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%50;
const cover=e=>`<div class="cov" style="--h:${hue(e.title)}">${e.cover_path?`<img src="${pub(e.cover_path)}" alt="" loading="lazy">`:esc([...e.title][0]||"ص")}</div>`;
const nLikes=id=>likes.filter(l=>l.episode_id===id).length,nCom=id=>cc.filter(c=>c.episode_id===id).length;
const meta=e=>`${date(e.created_at)} · ${fmt(e.duration_sec)} · ${nf.format(e.plays)} ${t("plays")} · ♥ ${nf.format(nLikes(e.id))} · 💬 ${nf.format(nCom(e.id))}`;

/* ── اللغة والرأس ── */
function setLang(l){lang=l;store.set("sawt.lang",l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";nf=new Intl.NumberFormat(l);hdr();route()}
function hdr(){
  $("hdr").innerHTML=`<a class="brand" href="#">Sawt<i>.</i></a><div class="nav"><select id="lg" aria-label="Language">${Object.keys(LN).map(l=>`<option value="${l}" ${l===lang?"selected":""}>${LN[l]}</option>`).join("")}</select>`+
  (session?`${isAdmin?`<a class="btn sm" href="#admin">${t("dash")}</a>`:""}<span class="meta">${esc(profile?profile.display_name:"")}</span><button class="btn sm" id="lo">${t("logout")}</button>`:`<a class="btn sm" href="#login">${t("login")}</a><a class="btn sm p" href="#signup">${t("signup")}</a>`)+`</div>`;
  $("lg").onchange=e=>setLang(e.target.value);if($("lo"))$("lo").onclick=()=>sb.auth.signOut();
}

/* ── البيانات ── */
async function loadAll(){
  const [a,b,c]=await Promise.all([sb.from("podcast_episodes").select("*").order("created_at",{ascending:false}),sb.from("episode_likes").select("episode_id,user_id"),sb.from("episode_comments").select("episode_id")]);
  if(a.error){app.innerHTML=`<p class="empty">${esc(a.error.message)}<br>setup.sql?</p>`;return false}
  eps=a.data;likes=b.data||[];cc=c.data||[];return true;
}
async function loadProfile(){profile=null;isAdmin=false;if(session){const r=await sb.from("profiles").select("display_name,role").eq("id",session.user.id).maybeSingle();profile=r.data;isAdmin=!!(profile&&profile.role==="admin")}}

/* ── التوجيه ── */
function route(){
  const h=location.hash.slice(1);window.scrollTo(0,0);
  if(h==="login"||h==="signup")return auth(h);
  if(h==="admin")return isAdmin?admin():(location.hash="");
  if(h.startsWith("ep-"))return detail(h.slice(3));
  home();
}
addEventListener("hashchange",route);

/* ── الرئيسية ── */
function home(){
  const live=eps.filter(e=>e.published),h=live[0];
  app.innerHTML=(h?`<div class="hero">${cover(h)}<div><div class="tag">${t("latest")}</div><h1>${esc(h.title)}</h1><p>${esc(h.description)}</p><div class="row"><button class="btn p" id="hp">▶ ${t("listen")}</button><span class="meta">${meta(h)}</span></div></div></div>`:"")+
  `<div class="bar"><h2>${t("all")}</h2><input id="q" type="search" placeholder="${t("search")}" value="${esc(query)}"></div><div id="list"></div>`;
  if(h)$("hp").onclick=()=>{select(h,true)};
  $("q").oninput=e=>{query=e.target.value;drawList()};drawList();
}
function drawList(){
  const l=eps.filter(e=>e.published&&(!query||(e.title+e.description).toLowerCase().includes(query.toLowerCase())));
  $("list").innerHTML=l.map(e=>`<div class="ep ${cur&&cur.id===e.id?"now":""}" data-id="${e.id}">${cover(e)}<div><h3>${esc(e.title)}</h3><div class="meta">${meta(e)}</div></div><button class="pb" aria-label="play">▶</button></div>`).join("")||`<p class="empty">${t("none")}</p>`;
  $("list").onclick=ev=>{const r=ev.target.closest(".ep");if(!r)return;if(ev.target.closest(".pb"))select(eps.find(x=>x.id===r.dataset.id),true);else location.hash="ep-"+r.dataset.id};
}

/* ── صفحة الحلقة: إعجاب وتعليقات ── */
async function detail(id){
  const e=eps.find(x=>x.id===id);if(!e)return home();
  const liked=()=>session&&likes.some(l=>l.episode_id===id&&l.user_id===session.user.id);
  app.innerHTML=`<a class="meta" href="#">← ${t("back")}</a><div class="hero full" style="margin-top:10px">${cover(e)}<div><h1>${esc(e.title)}</h1><p>${esc(e.description)}</p><div class="row"><button class="btn p" id="dp">▶ ${t("listen")}</button><button class="btn ${liked()?"on":""}" id="dl">♥ ${nf.format(nLikes(id))}</button></div><div class="meta" style="margin-top:8px">${meta(e)}</div></div></div>
  <h2 style="font-family:var(--fd)">${t("comments")}</h2><div id="cf"></div><div id="cl"></div>`;
  $("dp").onclick=()=>select(e,true);
  $("dl").onclick=async()=>{if(!session){location.hash="login";return}
    if(liked()){await sb.from("episode_likes").delete().match({episode_id:id,user_id:session.user.id});likes=likes.filter(l=>!(l.episode_id===id&&l.user_id===session.user.id))}
    else{const r=await sb.from("episode_likes").insert({episode_id:id});if(!r.error)likes.push({episode_id:id,user_id:session.user.id})}
    detail(id)};
  $("cf").innerHTML=session?`<div style="display:grid;gap:8px"><textarea id="ct" rows="2" maxlength="1000" placeholder="${t("addC")}"></textarea><button class="btn p" id="cs" style="justify-self:end">${t("send")}</button></div>`:`<p class="meta"><a href="#login" style="color:var(--accent)">${t("needLogin")}</a></p>`;
  if(session)$("cs").onclick=async()=>{const b=$("ct").value.trim();if(!b)return;const r=await sb.from("episode_comments").insert({episode_id:id,body:b});if(!r.error){cc.push({episode_id:id});comments()}};
  async function comments(){
    const{data}=await sb.from("episode_comments").select("id,body,created_at,user_id,profiles(display_name)").eq("episode_id",id).order("created_at",{ascending:false});
    $("cl").innerHTML=(data||[]).map(c=>`<div class="cm"><b>${esc(c.profiles?c.profiles.display_name:"?")}</b> <span class="meta">${date(c.created_at)}</span><p>${esc(c.body)}</p>${session&&(c.user_id===session.user.id||isAdmin)?`<button class="btn sm danger" data-d="${c.id}">${t("del")}</button>`:""}</div>`).join("")||`<p class="meta">${t("noC")}</p>`;
    $("cl").onclick=async ev=>{const d=ev.target.dataset.d;if(!d)return;await sb.from("episode_comments").delete().eq("id",d);cc.pop();comments()};
  }
  comments();
}

/* ── التسجيل والدخول ── */
function auth(mode){
  const su=mode==="signup";
  app.innerHTML=`<form class="box" id="af"><h2>${t(mode)}</h2>${su?`<label>${t("name")}<input id="an" required maxlength="40"></label>`:""}<label>${t("email")}<input id="ae" type="email" required autocomplete="username"></label><label>${t("pass")}<input id="ap" type="password" required minlength="6" autocomplete="${su?"new":"current"}-password"></label><div class="msg" id="am"></div><button class="btn p">${t(mode)}</button><p class="meta">${su?t("haveAcc"):t("noAcc")} <a href="#${su?"login":"signup"}" style="color:var(--accent)">${t(su?"login":"signup")}</a></p></form>`;
  $("af").onsubmit=async e=>{e.preventDefault();const em=$("ae").value.trim(),pw=$("ap").value;let r;
    if(su){r=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:$("an").value.trim()}}});if(!r.error&&!r.data.session){$("am").textContent=t("confirm");return}}
    else r=await sb.auth.signInWithPassword({email:em,password:pw});
    if(r.error)$("am").textContent=t("err")+r.error.message;else location.hash=""};
}

/* ── لوحة التحكم ── */
async function admin(){
  const u=await sb.from("profiles").select("id",{count:"exact",head:true});
  const cm=await sb.from("episode_comments").select("id,body,created_at,episode_id,profiles(display_name)").order("created_at",{ascending:false}).limit(20);
  const title=id=>(eps.find(e=>e.id===id)||{}).title||"";
  app.innerHTML=`<div class="stats">${[["sEps",eps.length],["sPlays",eps.reduce((s,e)=>s+e.plays,0)],["sLikes",likes.length],["sComm",cc.length],["sUsers",u.count||0]].map(([k,v])=>`<div class="stat"><b>${nf.format(v)}</b>${t(k)}</div>`).join("")}</div>
  <form class="sec" id="uf"><h2>${t("newEp")}</h2><label>${t("title")}<input id="ut" required maxlength="140"></label><label>${t("desc")}<textarea id="ud" rows="3"></textarea></label><label>${t("audio")}<input id="ua" type="file" accept="audio/*" required></label><label>${t("cover")}<input id="uc" type="file" accept="image/*"></label><div class="msg" id="um"></div><button class="btn p" id="ub" style="justify-self:start">${t("publish")}</button></form>
  <div class="sec" id="ml"><h2>${t("manage")}</h2>${eps.map(e=>`<div class="li"><span>${esc(e.title)}</span><span class="row"><button class="btn sm" data-p="${e.id}">${e.published?t("live"):t("draft")}</button><button class="btn sm danger" data-x="${e.id}">${t("del")}</button></span></div>`).join("")||`<p class="meta">${t("none")}</p>`}</div>
  <div class="sec" id="mc"><h2>${t("mod")}</h2>${(cm.data||[]).map(c=>`<div class="li"><span><b>${esc(c.profiles?c.profiles.display_name:"?")}</b> <span class="meta">· ${esc(title(c.episode_id))}</span><br>${esc(c.body)}</span><button class="btn sm danger" data-c="${c.id}">${t("del")}</button></div>`).join("")||`<p class="meta">${t("noC")}</p>`}</div>`;
  $("uf").onsubmit=async e=>{e.preventDefault();const a=$("ua").files[0],c=$("uc").files[0],m=$("um"),x=f=>(f.name.split(".").pop()||"bin").toLowerCase();
    $("ub").disabled=true;m.textContent=t("up");const id=crypto.randomUUID(),ap=`audio/${id}.${x(a)}`,cp=c?`covers/${id}.${x(c)}`:null;
    let r=await sb.storage.from("podcast").upload(ap,a,{contentType:a.type});
    if(!r.error&&c)r=await sb.storage.from("podcast").upload(cp,c,{contentType:c.type});
    if(!r.error){const d=await new Promise(ok=>{const q=new Audio(URL.createObjectURL(a));q.onloadedmetadata=()=>ok(Math.round(q.duration)||0);q.onerror=()=>ok(0)});
      r=await sb.from("podcast_episodes").insert({id,title:$("ut").value.trim(),description:$("ud").value.trim(),audio_path:ap,cover_path:cp,duration_sec:d})}
    if(r.error){m.textContent=t("err")+r.error.message;$("ub").disabled=false;return}
    await loadAll();admin()};
  $("ml").onclick=async ev=>{const p=ev.target.dataset.p,x=ev.target.dataset.x;
    if(p){const e=eps.find(v=>v.id===p);await sb.from("podcast_episodes").update({published:!e.published}).eq("id",p)}
    else if(x){if(!confirm(t("del")+"?"))return;const e=eps.find(v=>v.id===x);await sb.storage.from("podcast").remove([e.audio_path,e.cover_path].filter(Boolean));await sb.from("podcast_episodes").delete().eq("id",x);if(cur&&cur.id===x){au.pause();$("pl").hidden=true;cur=null}}
    else return;await loadAll();admin()};
  $("mc").onclick=async ev=>{const c=ev.target.dataset.c;if(!c)return;await sb.from("episode_comments").delete().eq("id",c);await loadAll();admin()};
}

/* ── المشغّل: استئناف، تشغيل التالي، مؤقت نوم ── */
function select(e,play){
  if(!cur||cur.id!==e.id){cur=e;au.src=pub(e.audio_path);const p=+store.get("sawt.pos."+e.id);au.onloadedmetadata=()=>{if(p>0&&p<au.duration-5)au.currentTime=p}}
  $("pl").hidden=false;$("pt").textContent=e.title;
  if(play){au.play().catch(()=>{});if(!counted[e.id]){counted[e.id]=1;e.plays++;sb.rpc("increment_plays",{ep:e.id})}}
  if($("list"))drawList();
}
$("pp").onclick=()=>au.paused?au.play():au.pause();
au.onplay=()=>$("pp").textContent="⏸";au.onpause=()=>$("pp").textContent="▶";
au.onended=()=>{const l=eps.filter(e=>e.published),i=l.findIndex(e=>e.id===cur.id);if(l[i+1])select(l[i+1],true)};
let last=0;au.ontimeupdate=()=>{if(!au.duration)return;$("seek").value=au.currentTime/au.duration*100;$("tc").textContent=fmt(au.currentTime);$("td").textContent=fmt(au.duration);if(cur&&Date.now()-last>4000){last=Date.now();store.set("sawt.pos."+cur.id,au.currentTime)}};
$("seek").oninput=e=>{if(au.duration)au.currentTime=e.target.value/100*au.duration};
$("b15").onclick=()=>au.currentTime-=15;$("f30").onclick=()=>au.currentTime+=30;
$("spd").onclick=()=>{const s=[1,1.25,1.5,2],n=s[(s.indexOf(au.playbackRate)+1)%4];au.playbackRate=n;$("spd").textContent=n+"×"};
let tm,si=0;$("slp").onclick=()=>{const o=[0,15,30,60];si=(si+1)%4;clearTimeout(tm);$("slp").textContent=o[si]?"🌙"+o[si]:"🌙";if(o[si])tm=setTimeout(()=>au.pause(),o[si]*6e4)};
$("share").onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+location.pathname+"#ep-"+cur.id);$("share").textContent="✓"}catch{}setTimeout(()=>$("share").textContent="🔗",1200)};

/* ── البدء ── */
nf=new Intl.NumberFormat(lang);
if(!CONFIG.URL||CONFIG.URL.startsWith("__")||!window.supabase){document.documentElement.lang=lang;hdr();app.innerHTML=`<p class="empty">${t("cfg")}</p>`}
else{
  sb=supabase.createClient(CONFIG.URL,CONFIG.KEY);
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";hdr();
  (async()=>{const r=await sb.auth.getSession();session=r.data.session;await loadProfile();hdr();if(await loadAll())route()})();
  sb.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(async()=>{await loadProfile();hdr();route()},0)});
}
</script>

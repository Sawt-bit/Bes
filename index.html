<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Hibr Writing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Source+Serif+4:wght@400;600&family=Reem+Kufi:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: a cinema strip on top (video + chapters), then the writing desk (editor beside corrections), then a shelf of related ideas.
   One palette for both themes: indigo ink, a highlighter-yellow marker for mistakes, mint for "all good". */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface-2: #e8ecf4;
  --ink: #14192b;
  --ink-soft: #566079;
  --line: #d6dce9;
  --primary: #3d4fd6;
  --primary-ink: #ffffff;
  --marker: #ffe58a;
  --marker-ink: #2d2400;
  --ok: #0c8f6e;
  --stage: #0f1424;
  --stage-2: #1a2138;
  --stage-ink: #eaeefb;
  --stage-soft: #9aa6c6;
  --stage-line: #2a3452;
  --font-ui: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-brand: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root[lang="ar"] { --font-read: "Noto Naskh Arabic", "IBM Plex Sans Arabic", serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1020; --surface: #151b2f; --surface-2: #1e2642; --ink: #e8ecf8; --ink-soft: #9ba6c4; --line: #2a3354;
    --primary: #8e9bff; --primary-ink: #0b1030; --marker: #5e4f10; --marker-ink: #fff1b8; --ok: #3ddcb5;
    --stage: #070a15; --stage-2: #141a2e; --stage-line: #252e4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1020; --surface: #151b2f; --surface-2: #1e2642; --ink: #e8ecf8; --ink-soft: #9ba6c4; --line: #2a3354;
  --primary: #8e9bff; --primary-ink: #0b1030; --marker: #5e4f10; --marker-ink: #fff1b8; --ok: #3ddcb5;
  --stage: #070a15; --stage-2: #141a2e; --stage-line: #252e4b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.6;
  padding-block: 18px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 22px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.brand h1 { font-family: var(--font-brand); font-size: 1.7rem; line-height: 1.1; margin: 0; letter-spacing: .02em; }
.brand p { margin: 0; font-size: .875rem; color: var(--ink-soft); }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: 11px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 500; color: var(--ink-soft); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.icon-btn svg[hidden] { display: none; }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* stage */
.stage { background: var(--stage); color: var(--stage-ink); border-radius: 18px; padding: 16px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.screen { display: grid; gap: 12px; min-width: 0; align-content: start; }
.frame { aspect-ratio: 16 / 9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
.frame video, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 16px;
  background: radial-gradient(120% 90% at 20% 10%, #2b3a8c 0%, transparent 55%), radial-gradient(90% 90% at 90% 100%, #0f6a63 0%, transparent 60%), #0b1022; }
.empty .play { width: 62px; height: 62px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); display: grid; place-items: center; }
.empty .play svg { width: 24px; height: 24px; fill: #fff; margin-inline-start: 3px; }
.empty h3 { margin: 0; font-size: 1.1rem; color: #fff; }
.empty p { margin: 0; font-size: .9rem; color: #c6cfee; max-width: 34ch; }
.src { display: flex; flex-wrap: wrap; gap: 8px; }
.src input[type="text"] { flex: 1 1 220px; min-width: 0; background: var(--stage-2); border: 1px solid var(--stage-line); color: var(--stage-ink); border-radius: 9px; padding: 8px 12px; }
.src input::placeholder { color: var(--stage-soft); }
.src .btn { background: var(--stage-2); border-color: var(--stage-line); color: var(--stage-ink); }
.src .btn:hover { background: #232c4a; }
.src .btn.main { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.err { color: #ffb4a8; font-size: .875rem; min-height: 1.3em; margin: 0; }

.info { display: grid; gap: 10px; align-content: start; min-width: 0; }
.tag { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--stage-soft); display: flex; align-items: center; gap: 8px; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff6a5e; }
.info h2 { margin: 0; font-size: 1.4rem; line-height: 1.3; text-wrap: balance; }
.info p.desc { margin: 0; color: var(--stage-soft); font-size: .9375rem; }
.chapters { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 4px; }
.chapters button { width: 100%; display: flex; gap: 12px; align-items: baseline; text-align: start; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--stage-ink); }
.chapters button:hover { background: var(--stage-2); }
.chapters button.on { background: var(--stage-2); border-color: var(--primary); }
.chapters time { font-family: var(--font-mono); font-size: .8rem; color: var(--stage-soft); flex: none; direction: ltr; }
.chapters button[disabled] { opacity: .5; cursor: default; }
.hint { margin: 0; font-size: .8125rem; color: var(--stage-soft); }

/* desk */
.desk { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
.panel h2, .panel h3 { margin: 0; font-size: 1.05rem; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
input#title { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-family: var(--font-read); font-size: 1.7rem; font-weight: 600; line-height: 1.3; padding: 4px 0 10px; }
input#title:focus-visible { outline: none; border-bottom-color: var(--primary); }
textarea#body { width: 100%; min-height: 420px; resize: vertical; border: 0; background: transparent; font-family: var(--font-read); font-size: 1.125rem; line-height: 1.85; padding: 0; }
textarea#body:focus-visible { outline: none; }
:root[lang="ar"] textarea#body, :root[lang="ar"] .reader { font-size: 1.25rem; line-height: 2.1; }
.reader { font-family: var(--font-read); font-size: 1.125rem; line-height: 1.85; min-height: 420px; }
.reader h2 { font-family: var(--font-read); font-size: 1.7rem; line-height: 1.3; margin: 0 0 14px; }
.reader h3 { font-family: var(--font-ui); font-size: 1.1rem; margin: 26px 0 6px; color: var(--primary); }
.reader p { margin: 0 0 12px; max-width: 68ch; }
.reader ul { margin: 0 0 12px; padding-inline-start: 22px; max-width: 68ch; }
mark { background: var(--marker); color: var(--marker-ink); border-radius: 3px; padding: 0 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--font-mono); font-size: .75rem; color: var(--ink-soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 15px; border-radius: 9px; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover:not(:disabled) { background: var(--primary); filter: brightness(1.1); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 11px; font-size: .875rem; }
.note { margin: 0; min-height: 1.4em; font-size: .875rem; color: var(--ok); }
.side { display: grid; gap: 18px; min-width: 0; }
.status { margin: 0; font-size: .875rem; color: var(--ink-soft); }
.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
.fix { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; gap: 6px; background: var(--bg); }
.fix .wrong { background: var(--marker); color: var(--marker-ink); border-radius: 3px; padding: 0 4px; }
.fix .why { font-size: .8125rem; color: var(--ink-soft); }
.fix .row { align-items: center; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: .9375rem; }
.checks li { display: flex; gap: 10px; align-items: baseline; }
.checks li::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); transform: translateY(1px); }
.checks li.warn::before { background: #f0b429; border-radius: 2px; }

/* ideas */
.ideas h2 { margin: 0; font-size: 1.4rem; }
.ideas > p { margin: 4px 0 0; color: var(--ink-soft); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card .k { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--primary); }
.card h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.card p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }
.card .btn { justify-self: start; margin-top: 4px; }

/* cast on stage */
.cast-stage { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.cast-stage figure { margin: 0; display: grid; justify-items: center; gap: 4px; animation: bob 3.2s ease-in-out infinite; }
.cast-stage figure:nth-child(2) { animation-delay: -1.1s; }
.cast-stage figure:nth-child(3) { animation-delay: -2.2s; }
.cast-stage figcaption { font-size: .8rem; color: #dfe6ff; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@media (prefers-reduced-motion: reduce) { .cast-stage figure { animation: none; } }
.cast { display: grid; gap: 8px; margin-top: 6px; }
.cast .k { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--stage-soft); }
.cast-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cast-chip { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; background: var(--stage-2); border: 1px solid var(--stage-line); border-radius: 999px; font-size: .875rem; }
:root[dir="rtl"] .cast-chip { padding: 4px 4px 4px 12px; }
.cast-chip svg { width: 32px; height: 32px; border-radius: 50%; }

/* characters */
.chars h2 { margin: 0; font-size: 1.4rem; }
.chars > p { margin: 4px 0 0; color: var(--ink-soft); }
.gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); margin-top: 16px; }
.char { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 8px; justify-items: center; text-align: center; min-width: 0; }
.char.in { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) inset; }
.char svg { width: 120px; height: 120px; max-width: 100%; border-radius: 30px; }
.char h3 { margin: 0; font-size: 1rem; }
.char p { margin: 0; font-size: .875rem; color: var(--ink-soft); }
.char .row { justify-content: center; }
#custom { margin-top: 16px; }
.custom-grid { display: grid; gap: 22px; grid-template-columns: 220px minmax(0, 1fr); align-items: start; }
.custom-grid .pv svg { width: 100%; max-width: 220px; height: auto; border-radius: 40px; }
.ctl { display: grid; gap: 14px; min-width: 0; }
.ctl .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.lab { display: grid; gap: 4px; font-size: .8125rem; color: var(--ink-soft); min-width: 0; }
.inp { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); }
.sw { display: flex; flex-wrap: wrap; gap: 8px; }
.sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary); }
.chk { display: flex; gap: 8px; align-items: center; }
.chk input { width: 18px; height: 18px; accent-color: var(--primary); }
.sync .row { align-items: center; }
.sync form { display: flex; flex-wrap: wrap; gap: 8px; }
.sync .inp { flex: 1 1 180px; width: auto; }
@media (max-width: 700px) { .custom-grid { grid-template-columns: minmax(0, 1fr); } .custom-grid .pv { justify-self: center; width: 180px; } }

@media (max-width: 900px) {
  .stage, .desk { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Hibr <span aria-hidden="true">·</span> حبر</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="tools">
      <nav class="seg" id="langs" aria-label="Language"></nav>
      <button class="icon-btn" id="theme" type="button" data-i18n-aria="themeLabel">
        <svg id="icoMoon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        <svg id="icoSun" viewBox="0 0 24 24" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="stage" aria-labelledby="epTitle">
    <div class="screen">
      <div class="frame" id="frame">
        <div class="empty" id="empty">
          <div class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg></div>
          <h3 data-i18n="emptyTitle"></h3>
          <p data-i18n="emptyText"></p>
          <div class="cast-stage" id="castStage"></div>
        </div>
      </div>
      <form class="src" id="srcForm">
        <input type="text" id="url" dir="ltr" data-i18n-ph="urlPh" data-i18n-aria="urlPh">
        <button class="btn main" type="submit" data-i18n="load"></button>
        <label class="btn" for="file" data-i18n="chooseFile" style="cursor:pointer"></label>
        <input type="file" id="file" accept="video/*" hidden>
      </form>
      <p class="err" id="vidErr" role="status"></p>
    </div>
    <div class="info">
      <span class="tag" data-i18n="stageTag"></span>
      <h2 id="epTitle"></h2>
      <p class="desc" id="epDesc"></p>
      <ul class="chapters" id="chapters"></ul>
      <p class="hint" id="chapNote"></p>
      <div class="cast"><span class="k" data-i18n="castTitle"></span><div class="cast-chips" id="castChips"></div></div>
    </div>
  </section>

  <div class="desk">
    <section class="panel" aria-label="Article">
      <div class="bar">
        <div class="seg" role="tablist" id="tabs">
          <button type="button" role="tab" id="tabWrite" aria-selected="true" data-i18n="tabWrite"></button>
          <button type="button" role="tab" id="tabRead" aria-selected="false" data-i18n="tabRead"></button>
        </div>
        <div class="meta"><span id="count"></span></div>
      </div>
      <input type="text" id="title" dir="auto" data-i18n-ph="titlePh" data-i18n-aria="titlePh">
      <textarea id="body" dir="auto" spellcheck="true" data-i18n-ph="bodyPh" data-i18n-aria="bodyPh"></textarea>
      <div class="reader" id="reader" dir="auto" hidden></div>
      <div class="row">
        <button class="btn primary" id="check" type="button" data-i18n="check"></button>
        <button class="btn" id="chap" type="button" data-i18n="insertChapters"></button>
        <button class="btn" id="copy" type="button" data-i18n="copy"></button>
        <button class="btn" id="reset" type="button" data-i18n="reset"></button>
      </div>
      <p class="note" id="note" role="status"></p>
    </section>

    <aside class="side">
      <section class="panel">
        <h2 data-i18n="corrTitle"></h2>
        <p class="status" id="corrStatus" role="status"></p>
        <div class="row"><button class="btn small" id="fixAll" type="button" data-i18n="fixAll" hidden></button></div>
        <ul class="fixes" id="fixes"></ul>
      </section>
      <section class="panel">
        <h2 data-i18n="styleTitle"></h2>
        <ul class="checks" id="checks"></ul>
      </section>
    </aside>
  </div>

  <section class="ideas" aria-labelledby="ideasTitle">
    <h2 id="ideasTitle" data-i18n="ideasTitle"></h2>
    <p data-i18n="ideasSub"></p>
    <div class="cards" id="cards"></div>
  </section>
  <section class="chars" aria-labelledby="charsTitle">
    <h2 id="charsTitle" data-i18n="charsTitle"></h2>
    <p data-i18n="charsSub"></p>
    <div class="gallery" id="gallery"></div>
    <div class="panel" id="custom" hidden>
      <div class="custom-grid">
        <div class="pv" id="pv"></div>
        <div class="ctl">
          <div class="two">
            <label class="lab"><span data-i18n="cName"></span><input class="inp" id="cName" type="text" dir="auto"></label>
            <label class="lab"><span data-i18n="cRole"></span><input class="inp" id="cRole" type="text" dir="auto"></label>
          </div>
          <div class="lab"><span data-i18n="cSkin"></span><div class="sw" id="swSkin"></div></div>
          <div class="lab"><span data-i18n="cHair"></span><div class="sw" id="swHair"></div></div>
          <div class="lab"><span data-i18n="cOutfit"></span><div class="sw" id="swOutfit"></div></div>
          <div class="lab"><span data-i18n="cBg"></span><div class="sw" id="swBg"></div></div>
          <label class="chk"><input type="checkbox" id="cAcc"><span id="cAccLabel"></span></label>
          <div class="lab"><span data-i18n="cMood"></span><div class="seg" id="segMood"></div></div>
          <div class="row">
            <button class="btn" id="cDl" type="button" data-i18n="cDl"></button>
            <button class="btn" id="cReset" type="button" data-i18n="cReset"></button>
            <button class="btn primary" id="cClose" type="button" data-i18n="cClose"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="panel sync" id="sync">
    <h2 data-i18n="syncTitle"></h2>
    <p class="status" id="syncStatus" role="status"></p>
    <form id="loginForm" hidden>
      <input class="inp" id="email" type="email" autocomplete="username" data-i18n-ph="email" data-i18n-aria="email">
      <input class="inp" id="password" type="password" autocomplete="current-password" data-i18n-ph="password" data-i18n-aria="password">
      <button class="btn primary" type="submit" data-i18n="signIn"></button>
    </form>
    <div class="row">
      <button class="btn primary" id="saveAll" type="button" data-i18n="saveAll" hidden></button>
      <button class="btn" id="testConn" type="button" data-i18n="testConn" hidden></button>
      <button class="btn" id="signOut" type="button" data-i18n="signOut" hidden></button>
    </div>
    <p class="note" id="syncNote" role="status"></p>
  </section>
</div>

/* ── quick local rules + online checker ── */
const B = (s) => new RegExp("(?<![\\p{L}\\p{M}\\p{N}])(" + s + ")(?![\\p{L}\\p{M}\\p{N}])", "giu");

}
async function ltCheck(text) {

  } finally { clearTimeout(to); }
}

  return out;
}
async function runCheck() {

}

function renderChecks() {

  const longP = paras.filter(p => wordsOf(p) > 110).length;
  const longS = text.split(/(?<=[.!?؟…])\s+/).filter(s => wordsOf(s) > 28).length;
  const items = [
    w >= 120 ? [true, t("lenOk")] : [false, t("lenWarn")],
    (w <= 200 || /^##\s/m.test(text)) ? [true, t("headOk")] : [false, t("headWarn")],
    longP ? [false, fmt(t("paraWarn"), longP)] : [true, t("paraOk")],

function renderReader() {

  const text = $("body").value; let pos = 0, ul = null;

function loadCast() { try { const c = JSON.parse(store.get("hibr.cast") || "null"); return Array.isArray(c) ? c.filter(i => i >= 0 && i < 6).slice(0, 3) : [0, 5]; } catch { return [0, 5]; } }
function saveChars() { store.set("hibr.chars", JSON.stringify(chars.map(({ kind, ...r }) => r))); store.set("hibr.cast", JSON.stringify(cast)); }
const cname = i => chars[i].name || D().chars[i].n, crole = i => chars[i].role || D().chars[i].r;

function renderGallery() {
  const g = $("gallery"); g.innerHTML = "";
  chars.forEach((c, i) => {
    const el = document.createElement("article"); el.className = "char" + (cast.includes(i) ? " in" : "");
    el.innerHTML = avatarSVG(c, 120, cname(i)) + "<h3></h3><p></p>";
    el.querySelector("h3").textContent = cname(i); el.querySelector("p").textContent = crole(i);
    const row = document.createElement("div"); row.className = "row";
    const a = document.createElement("button"); a.type = "button"; a.className = "btn small"; a.textContent = t("customize"); a.onclick = () => openCustom(i);
    const b = document.createElement("button"); b.type = "button"; b.className = "btn small" + (cast.includes(i) ? " primary" : ""); b.textContent = cast.includes(i) ? t("inCast") : t("addCast");
    b.onclick = () => toggleCast(i); row.append(a, b); el.appendChild(row); g.appendChild(el);
  });
}
function toggleCast(i) {
  if (cast.includes(i)) cast = cast.filter(x => x !== i);
  else { if (cast.length >= 3) { note(t("castMax")); return; } cast.push(i); }
  saveChars(); renderGallery(); renderCast();
}
function renderCast() {
  const st = $("castStage"), ch = $("castChips"); st.innerHTML = ""; ch.innerHTML = "";
  cast.forEach(i => {
    const f = document.createElement("figure"); f.innerHTML = avatarSVG(chars[i], 84, cname(i)); const cap = document.createElement("figcaption"); cap.textContent = cname(i); f.appendChild(cap); st.appendChild(f);
    const chip = document.createElement("span"); chip.className = "cast-chip"; chip.innerHTML = avatarSVG(chars[i], 32, cname(i)); chip.append(cname(i)); ch.appendChild(chip);
  });
  if (!cast.length) { const e = document.createElement("span"); e.className = "hint"; e.textContent = t("castEmpty"); ch.appendChild(e); }
}
function swatches(id, list, key) {
  const box = $(id); box.innerHTML = "";
  list.forEach(col => { const b = document.createElement("button"); b.type = "button"; b.style.background = col; b.setAttribute("aria-label", col); b.setAttribute("aria-pressed", chars[editing][key] === col);
    b.onclick = () => { chars[editing][key] = col; afterEdit(); }; box.appendChild(b); });
}
function renderCustomLabels() {
  if (editing < 0) return;
  $("cName").placeholder = D().chars[editing].n; $("cRole").placeholder = D().chars[editing].r; $("cAccLabel").textContent = D().chars[editing].a;
  const seg = $("segMood"); seg.innerHTML = "";
  t("moods").forEach((m, k) => { const b = document.createElement("button"); b.type = "button"; b.textContent = m; b.setAttribute("aria-pressed", chars[editing].mood === k); b.onclick = () => { chars[editing].mood = k; afterEdit(); }; seg.appendChild(b); });
}
function paintCustom() {
  const c = chars[editing];
  $("pv").innerHTML = avatarSVG(c, 220, cname(editing));
  swatches("swSkin", SKIN, "skin"); swatches("swHair", HAIR, "hair"); swatches("swOutfit", OUTFIT, "outfit"); swatches("swBg", BG, "bg");
  $("cAcc").checked = !!c.acc; renderCustomLabels();
}
function openCustom(i) {
  editing = i; $("custom").hidden = false; $("cName").value = chars[i].name || ""; $("cRole").value = chars[i].role || "";
  paintCustom(); $("custom").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function afterEdit() { saveChars(); paintCustom(); renderGallery(); renderCast(); }
function downloadSvg() {
  const c = chars[editing]; const svg = '<?xml version="1.0" encoding="UTF-8"?>\n' + avatarSVG(c, 512, cname(editing));
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" })); const a = document.createElement("a");
  a.href = url; a.download = "hibr-" + c.kind + ".svg"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ── Supabase sync ── */
function syncStatus() {
  const st = $("syncStatus"); if (!st) return;
  $("loginForm").hidden = !sb || !!session; $("saveAll").hidden = !sb || !session; $("signOut").hidden = !sb || !session; $("testConn").hidden = !sb;
  st.textContent = !sb ? t("syncDemo") : session ? t("syncIn") : t("syncReady");
}
const sbNote = (m, bad) => { const n = $("syncNote"); n.textContent = m; n.style.color = bad ? "var(--marker-ink)" : ""; n.style.background = bad ? "var(--marker)" : ""; };
async function pull() {
  const [c, a, e] = await Promise.all([sb.from("characters").select("*"), sb.from("articles").select("*"), sb.from("episode").select("*").eq("id", 1).maybeSingle()]);
  if (c.error || a.error || e.error) throw (c.error || a.error || e.error);
  let any = false;
  (c.data || []).forEach(r => { const i = r.slot - 1; if (i >= 0 && i < 6) { chars[i] = { ...DEF[i], ...(r.cfg || {}), name: r.name || null, role: r.role || null, kind: DEF[i].kind }; any = true; } });
  if (e.data) { if (Array.isArray(e.data.cast_slots)) cast = e.data.cast_slots.map(x => x - 1).filter(x => x >= 0 && x < 6).slice(0, 3); if (e.data.video_url) { $("url").value = e.data.video_url; loadVideo(e.data.video_url, true); } any = true; }
  const d = drafts(); (a.data || []).forEach(r => { if (LANGS[r.lang]) { d[r.lang] = { title: r.title || "", body: r.body || "" }; any = true; } });
  store.set("hibr.drafts", JSON.stringify(d)); saveChars();
  loadDraft(); matches = localCheck($("body").value); mode = "quick"; applyI18n();
  return any;
}
async function push() {
  saveDraft(); const d = drafts(), tasks = [];
  tasks.push(sb.from("characters").upsert(chars.map((c, i) => { const { kind, name, role, ...cfg } = c; return { slot: i + 1, name: name || null, role: role || null, cfg, updated_at: new Date().toISOString() }; })));
  const rows = Object.keys(d).filter(l => LANGS[l]).map(l => ({ lang: l, title: d[l].title, body: d[l].body, updated_at: new Date().toISOString() }));
  if (rows.length) tasks.push(sb.from("articles").upsert(rows));
  tasks.push(sb.from("episode").upsert({ id: 1, video_url: store.get("hibr.video") || null, cast_slots: cast.map(i => i + 1), updated_at: new Date().toISOString() }));
  const res = await Promise.all(tasks); const bad = res.find(r => r.error); if (bad) throw bad.error;
}
async function testConn() {
  sbNote("…");
  try { const r = await sb.from("characters").select("slot").limit(1);
    if (r.error) { sbNote(/relation|schema cache|does not exist|PGRST205|42P01/i.test(r.error.message + (r.error.code || "")) ? t("dTables") : t("errPre") + r.error.message, true); }
    else sbNote(t("dOk"));
  } catch { sbNote(t("dUrl"), true); }
}
function initSupabase() {
  const ok = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase; if (!ok) return;
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  sb.auth.getSession().then(r => { session = r.data.session; syncStatus(); });
  sb.auth.onAuthStateChange((_e, s) => { session = s; syncStatus(); });
  $("loginForm").addEventListener("submit", async e => { e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value }); if (error) sbNote(t("errPre") + error.message, true); else sbNote(""); });
  $("signOut").onclick = () => sb.auth.signOut(); $("testConn").onclick = testConn;
  $("saveAll").onclick = async () => { sbNote("…"); try { await push(); sbNote(t("savedOk")); } catch (e) { sbNote(t("errPre") + (e.message || e), true); } };
  pull().then(any => { if (any) sbNote(t("loadedOk")); }).catch(e => sbNote(/relation|schema cache|PGRST205|42P01/i.test((e.message || "") + (e.code || "")) ? t("dTables") : t("errPre") + (e.message || e), true));
  syncStatus();
}

/* ── events ── */
function init() {
  Object.entries(LANGS).forEach(([k, v]) => { const b = document.createElement("button"); b.type = "button"; b.dataset.l = k; b.lang = k; b.textContent = v.name; b.onclick = () => setLang(k); $("langs").appendChild(b); });
  const th = store.get("hibr.theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; paintThemeIcon();
  const saved = store.get("hibr.lang"), nav = (navigator.language || "ar").slice(0, 2);
  lang = LANGS[saved] ? saved : (LANGS[nav] ? nav : "ar");
  chars = loadChars(); cast = loadCast(); loadDraft();
  $("cName").addEventListener("input", e => { chars[editing].name = e.target.value.trim() || null; saveChars(); renderGallery(); renderCast(); $("pv").innerHTML = avatarSVG(chars[editing], 220, cname(editing)); });
  $("cRole").addEventListener("input", e => { chars[editing].role = e.target.value.trim() || null; saveChars(); renderGallery(); });
  $("cAcc").addEventListener("change", e => { chars[editing].acc = e.target.checked; afterEdit(); });
  $("cClose").onclick = () => { $("custom").hidden = true; editing = -1; };
  $("cReset").onclick = () => { chars[editing] = { ...DEF[editing] }; $("cName").value = ""; $("cRole").value = ""; afterEdit(); };
  $("cDl").onclick = downloadSvg;
  $("body").addEventListener("input", () => onType(false)); $("title").addEventListener("input", () => { saveDraft(); if (tab === "read") renderReader(); });
  $("tabWrite").onclick = () => setTab("write"); $("tabRead").onclick = () => setTab("read");
  $("check").onclick = runCheck; $("fixAll").onclick = () => { [...matches].filter(m => m.replacements.length).sort((a, b) => b.offset - a.offset).forEach(m => applyMatch(m, m.replacements[0])); };
  $("chap").onclick = () => { appendBlock(D().episode.chapters.map(c => "## " + c[1]).join("\n\n")); note(t("inserted")); };
  $("copy").onclick = async () => {
    const txt = $("title").value + "\n\n" + $("body").value;
    try { await navigator.clipboard.writeText(txt); note(t("copied")); } catch { setTab("write"); $("body").focus(); $("body").select(); note(t("copyFail")); }
  };
  $("reset").onclick = () => {
    if (Date.now() - resetArm > 3000) { resetArm = Date.now(); $("reset").textContent = t("resetConfirm"); setTimeout(() => $("reset").textContent = t("reset"), 3000); return; }
    resetArm = 0; $("reset").textContent = t("reset"); $("title").value = D().sample.title; $("body").value = D().sample.body; matches = []; mode = "idle"; saveDraft(); updateAll();
  };
  $("srcForm").addEventListener("submit", e => { e.preventDefault(); loadVideo($("url").value, true); });
  $("file").addEventListener("change", e => { const f = e.target.files[0]; if (f) loadVideo(URL.createObjectURL(f), false); });
  const v = store.get("hibr.video"); if (v) { $("url").value = v; loadVideo(v, false); }
  applyI18n(); matches = localCheck($("body").value); mode = "quick"; updateAll();
  initSupabase();
}
init();
</script>

/* Layout: a broadcast desk. Wordmark and language switch on top, the voice desk (left) next to the episode shelf (right); stacks on phones. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e4e9ee;
  --ink: #0f1b2d;
  --ink-soft: #4d5b6e;
  --line: #cfd7e0;
  --accent: #0b7a75;
  --accent-ink: #ffffff;
  --live: #d93a2f;
  --font-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218; --surface: #141c25; --surface-2: #1c2733; --ink: #e8eef4;
    --ink-soft: #94a3b5; --line: #263341; --accent: #3cc4b9; --accent-ink: #06201e; --live: #ff6a5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218; --surface: #141c25; --surface-2: #1c2733; --ink: #e8eef4;
  --ink-soft: #94a3b5; --line: #263341; --accent: #3cc4b9; --accent-ink: #06201e; --live: #ff6a5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin-inline: auto; display: grid; gap: 24px; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; flex: none; }
.brand-mark i { width: 14px; height: 14px; border-radius: 50%; background: var(--live); }
.brand h1 { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; margin: 0; letter-spacing: .02em; }
.brand p { margin: 0; color: var(--ink-soft); font-size: .875rem; }
.langs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 12px; }
.langs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-soft); }
.langs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.15); }

.banner { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; font-size: .875rem; color: var(--ink-soft); }
.banner[hidden] { display: none; }

.grid { display: grid; gap: 24px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1.35rem; margin: 0; display: flex; align-items: center; gap: 10px; }
.onair { font-family: var(--font-mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-soft); font-weight: 500; }
.onair.live { border-color: var(--live); color: var(--live); }

textarea#text { width: 100%; min-height: 260px; resize: vertical; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; line-height: 1.8; font-size: 1.05rem; }
.meta { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: .75rem; color: var(--ink-soft); }

.controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
label.field { display: grid; gap: 4px; font-size: .8125rem; color: var(--ink-soft); min-width: 0; }
select, input[type="text"], input[type="email"], input[type="password"] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.val { font-family: var(--font-mono); color: var(--ink); }

.meter { display: flex; align-items: center; gap: 3px; height: 36px; padding-inline: 4px; }
.meter span { flex: 1; max-width: 6px; height: 6px; border-radius: 3px; background: var(--line); transition: background .2s; }
.meter.live span { background: var(--accent); animation: lvl 0.9s ease-in-out infinite alternate; }
@keyframes lvl { from { height: 6px; } to { height: 32px; } }
@media (prefers-reduced-motion: reduce) { .meter.live span { animation: none; height: 20px; } }

.row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 9px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 5px 12px; font-size: .875rem; }

.divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.save { display: grid; gap: 12px; }
.save h3, .admin summary { font-size: .9375rem; margin: 0; font-weight: 600; }
.note { margin: 0; font-size: .8125rem; color: var(--ink-soft); }
audio { width: 100%; }
.admin { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--bg); }
.admin summary { cursor: pointer; }
.admin form { display: grid; gap: 10px; margin-top: 10px; }
.toast { min-height: 1.4em; font-size: .875rem; color: var(--accent); }
.toast.err { color: var(--live); }

/* episodes */
.eps { display: grid; gap: 14px; }
.ep { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; background: var(--bg); min-width: 0; }
.ep header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ep h3 { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.ep time { font-family: var(--font-mono); font-size: .75rem; color: var(--ink-soft); }
.ep p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }
.ep .btn { justify-self: start; }
.meta span:first-child { white-space: nowrap; }
.meta span:last-child { text-align: end; font-family: var(--font-body); }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
.reader { background: var(--bg); border: 1px solid var(--accent); border-radius: 10px; padding: 14px; min-height: 260px; max-height: 420px; overflow-y: auto; line-height: 1.9; font-size: 1.05rem; }
.reader[hidden] { display: none; }
.reader span { padding: 1px 2px; border-radius: 4px; transition: background .2s, color .2s; color: var(--ink-soft); }
.reader span.done { color: var(--ink); }
.reader span.now { background: var(--accent); color: var(--accent-ink); }
.gen-busy { position: relative; overflow: hidden; }
.gen-busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(127,127,127,.35), transparent); animation: sweep 1.2s linear infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .gen-busy::after { animation: none; } }
.chips { display: flex; gap: 4px; }
.chip { font-family: var(--font-mono); font-size: .6875rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink-soft); text-transform: uppercase; }
.chip.on { border-color: var(--accent); color: var(--accent); }
details.script summary { cursor: pointer; font-size: .875rem; color: var(--accent); }
details.script p { margin-top: 8px; color: var(--ink); white-space: pre-wrap; }
.empty { color: var(--ink-soft); padding: 12px 0; }
</style>

        <div class="row"><button class="btn primary" id="save" type="button" data-i18n="save"></button></div>
        <p class="note" id="saveNote"></p>

            <div class="row"><button class="btn small primary" type="submit" data-i18n="signIn"></button>

          </form>
        </details>
      </div>
    </section>

    <section class="panel" aria-labelledby="epsTitle">
      <h2 id="epsTitle" data-i18n="episodes"></h2>
      <div class="eps" id="eps"></div>
    </section>
  </div>
</div>

    fr: { title: "Bienvenue sur Sawt", description: "Premier épisode : pourquoi nous avons lancé cette émission.", script: "Bienvenue dans ce premier épisode. Nous parlons aujourd’hui de l’idée de l’émission et de notre choix de raconter par la voix." },
    es: { title: "Bienvenidos a Sawt", description: "Primer episodio: por qué empezamos este programa.", script: "Bienvenidos al primer episodio. Hoy hablamos de la idea del programa y de por qué elegimos contar historias con la voz." },
    en: { title: "Welcome to Sawt", description: "Episode one: why we started this show.", script: "Welcome to the first episode. Today we talk about the idea behind the show and why we chose to tell stories with voice." } } },
  { id: "d2", created_at: "2026-10-19", audio_url: null, tr: {
    ar: { title: "أصوات المدينة", description: "جولة بين الأسواق والمحطات والمقاهي.", script: "في هذه الحلقة نسمع المدينة: بائع الخبز، وصافرة القطار، وضحكات المقهى عند المساء." },
    fr: { title: "Les voix de la ville", description: "Un tour des marchés, des gares et des cafés.", script: "Dans cet épisode, nous écoutons la ville : le boulanger, le sifflet du train et les rires du café, le soir." },
    en: { title: "Voices of the city", description: "A walk through markets, stations and cafés.", script: "In this episode we listen to the city: the baker, the train whistle and the laughter of the café in the evening." } } },
  { id: "d3", created_at: "2026-10-26", audio_url: null, tr: {
    es: { title: "El valor del silencio", description: "Una pausa para escuchar lo que no se dice.", script: "Hoy hacemos una pausa. El silencio también es parte de cada historia, y a veces es la parte más importante." } } }
];

let lang = "ar", override = {}, sb = null, session = null, episodes = [], touched = false, cloudPath = null, voices = [];
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const t = k => (override[lang] && override[lang][k]) ?? T[lang][k] ?? T.en[k] ?? k;

/* ── i18n ── */
function applyLang() {
  const L = LANGS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-placeholder]").forEach(e => e.placeholder = t(e.dataset.i18nPlaceholder));
  document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  $("langs").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  if (!touched) $("text").value = t("sample");
  updateCount(); fillVoices(); fillAttach(); renderEpisodes(); setStatus(speechSynthesis.speaking); updateNotes();
}
function setLang(l) { lang = l; store.set("sawt.lang", l); stopSpeech(); applyLang(); loadOverrides(); }

/* ── speech ── */
function fillVoices() {
  voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => v.lang.toLowerCase().startsWith(lang));
  const sel = $("voice"); sel.innerHTML = "";
  voices.forEach((v, i) => { const o = document.createElement("option"); o.value = i; o.textContent = v.name; sel.appendChild(o); });
  if (!voices.length) { const o = document.createElement("option"); o.textContent = "—"; sel.appendChild(o); }
  $("voiceNote").textContent = voices.length ? voices.length + " " + t("voices") : t("noVoice");
}
function setStatus(on) {
  const el = $("onair"); el.textContent = on ? t("live") : t("idle"); el.classList.toggle("live", !!on);
  $("meter").classList.toggle("live", !!on);
  $("pause").disabled = $("stop").disabled = !on;
}
function say(text, onend) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGS[lang].bcp;
  const v = voices[$("voice").value]; if (v) u.voice = v;
  u.rate = +$("rate").value; u.pitch = +$("pitch").value;
  const marks = showReader(text);
  u.onstart = () => setStatus(true);
  u.onboundary = e => highlight(marks, e.charIndex, text.length);
  u.onend = u.onerror = () => { hideReader(); setStatus(false); $("pause").textContent = t("pause"); onend && onend(); };
  speechSynthesis.speak(u);
}
function showReader(text) {
  const box = $("reader"); box.innerHTML = ""; const marks = []; let pos = 0;
  (text.match(/[^.!?؟۔\n]+[.!?؟۔]*\s*/g) || [text]).forEach(part => {
    const sp = document.createElement("span"); sp.textContent = part; box.appendChild(sp);
    marks.push({ el: sp, start: pos, end: pos + part.length }); pos += part.length;
  });
  $("text").hidden = true; box.hidden = false; $("bar").style.width = "0";
  return marks;
}
function highlight(marks, idx, total) {
  marks.forEach(m => { m.el.classList.toggle("now", idx >= m.start && idx < m.end); m.el.classList.toggle("done", idx >= m.end); });
  const cur = marks.find(m => idx >= m.start && idx < m.end);
  if (cur) cur.el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("bar").style.width = Math.min(100, (idx / total) * 100) + "%";
}
function hideReader() { $("reader").hidden = true; $("text").hidden = false; $("bar").style.width = "0"; }
function stopSpeech() { if (window.speechSynthesis) speechSynthesis.cancel(); hideReader(); setStatus(false); }
function updateCount() {
  const v = $("text").value, w = (v.trim().match(/\S+/g) || []).length;
  $("count").textContent = v.length + " " + t("chars") + " · " + w + " " + t("words") + " · ~" + (w ? Math.max(1, Math.round(w / 150)) : 0) + " " + t("min");
}
function updateNotes() {
  $("saveNote").textContent = sb ? "" : t("saveDemo");
  $("gen").disabled = !(sb && session);
  $("gen").title = $("gen").disabled ? t("genNeedsSb") : "";
  $("cloudBlock").hidden = !sb;
}

/* ── data ── */
function normalize(rows) {
  return rows.map(r => {
    const tr = {};
    (r.episode_translations || []).forEach(x => {
      tr[x.lang] = { title: x.title, description: x.description, script: x.script,
        audio_url: x.audio_path ? sb.storage.from("episodes").getPublicUrl(x.audio_path).data.publicUrl : null };
    });
    return { id: r.id, created_at: r.created_at, tr };
  });
}
async function loadEpisodes() {
  if (!sb) { episodes = DEMO_EPISODES.map(e => ({ ...e })).reverse(); return renderEpisodes(); }
  const { data, error } = await sb.from("episodes")
    .select("id, created_at, episode_translations(lang, title, description, script, audio_path)")
    .eq("published", true).order("created_at", { ascending: false });
  if (error) return toast(t("err") + error.message, true);
  episodes = normalize(data); fillAttach(); renderEpisodes();
}
async function loadOverrides() {
  if (!sb) return;
  const { data } = await sb.from("ui_translations").select("key, value").eq("lang", lang);
  if (data && data.length) { override[lang] = Object.fromEntries(data.map(r => [r.key, r.value])); applyLangLight(); }
}
function applyLangLight() { document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = t(e.dataset.i18n)); renderEpisodes(); }

function pick(ep) {
  if (ep.tr[lang]) return { ...ep.tr[lang], fb: false, lang };
  const other = ["en", "fr", "es", "ar"].find(l => ep.tr[l]);
  return other ? { ...ep.tr[other], fb: true, lang: other } : null;
}
function renderEpisodes() {
  const box = $("eps"); box.innerHTML = "";
  if (!episodes.length) { box.innerHTML = '<div class="empty"></div>'; box.firstChild.textContent = t("empty"); return; }
  const fmt = new Intl.DateTimeFormat(LANGS[lang].bcp, { dateStyle: "medium" });
  episodes.forEach(ep => {
    const c = pick(ep); if (!c) return;
    const card = document.createElement("article"); card.className = "ep";
    const head = document.createElement("header");
    const h = document.createElement("h3"); h.textContent = c.title; h.lang = c.lang; h.dir = LANGS[c.lang].dir;
    const tm = document.createElement("time"); tm.textContent = fmt.format(new Date(ep.created_at));
    head.append(h, tm);
    const chips = document.createElement("div"); chips.className = "chips";
    Object.keys(LANGS).forEach(l => { const s = document.createElement("span"); s.className = "chip" + (ep.tr[l] ? " on" : ""); s.textContent = l; chips.appendChild(s); });
    card.append(head, chips);
    if (c.description) { const p = document.createElement("p"); p.textContent = c.description; p.lang = c.lang; p.dir = LANGS[c.lang].dir; card.appendChild(p); }
    if (c.fb) { const n = document.createElement("p"); n.className = "note"; n.textContent = t("fallback") + " (" + LANGS[c.lang].name + ")"; card.appendChild(n); }
    if (c.audio_url) { const a = document.createElement("audio"); a.controls = true; a.preload = "none"; a.src = c.audio_url; card.appendChild(a); }
    else if (c.script) {
      const b = document.createElement("button"); b.className = "btn small"; b.type = "button"; b.textContent = "▶ " + t("listen");
      b.onclick = () => { const L = lang; lang = c.lang; fillVoicesQuiet(); say(c.script); lang = L; fillVoices(); };
      card.appendChild(b);
    }
    if (c.script) {
      const d = document.createElement("details"); d.className = "script";
      const s = document.createElement("summary"); s.textContent = t("showScript");
      const p = document.createElement("p"); p.textContent = c.script; p.lang = c.lang; p.dir = LANGS[c.lang].dir;
      d.append(s, p); card.appendChild(d);
    }
    box.appendChild(card);
  });
}
function fillVoicesQuiet() { voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => v.lang.toLowerCase().startsWith(lang)); $("voice").value = 0; }
function fillAttach() {
  const sel = $("epAttach"); sel.innerHTML = "";
  const n = document.createElement("option"); n.value = ""; n.textContent = t("newEp"); sel.appendChild(n);
  episodes.forEach(ep => {
    const c = pick(ep); if (!c || ep.tr[lang]) return;
    const o = document.createElement("option"); o.value = ep.id; o.textContent = t("transOf") + " " + c.title; sel.appendChild(o);
  });
}

/* ── save / generate / auth ── */
function toast(msg, isErr) { const el = $("toast"); el.textContent = msg; el.classList.toggle("err", !!isErr); }
async function saveEpisode() {
  const title = $("epTitle").value.trim(), script = $("text").value.trim(), attach = $("epAttach").value;
  if (!title || !script) return toast(t("needTitle"), true);
  if (!sb) {
    let ep = attach && episodes.find(e => e.id === attach);
    if (!ep) { ep = { id: "d" + Date.now(), created_at: new Date().toISOString(), tr: {} }; episodes.unshift(ep); }
    ep.tr[lang] = { title, description: "", script };
    $("epTitle").value = ""; fillAttach(); renderEpisodes(); return toast(t("saved"));
  }
  if (!session) return toast(t("needLogin"), true);
  let id = attach;
  if (!id) {
    const { data, error } = await sb.from("episodes").insert({ published: true }).select("id").single();
    if (error) return toast(t("err") + error.message, true);
    id = data.id;
  }
  const { error } = await sb.from("episode_translations").upsert({ episode_id: id, lang, title, script, audio_path: cloudPath });
  if (error) return toast(t("err") + error.message, true);
  cloudPath = null; $("dl").hidden = true; $("preview").hidden = true; $("epTitle").value = "";
  toast(t("saved")); loadEpisodes();
}
async function downloadMp3() {
  if (!cloudPath) return;
  const { data, error } = await sb.storage.from("episodes").download(cloudPath);
  if (error) return toast(t("err") + error.message, true);
  const url = URL.createObjectURL(data), a = document.createElement("a");
  const name = ($("epTitle").value.trim() || "sawt-" + lang).replace(/[\\/:*?"<>|]+/g, "-");
  a.href = url; a.download = name + ".mp3"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function generateMp3() {
  const text = $("text").value.trim(); if (!text) { toast(t("needTitle"), true); return false; }
  $("gen").disabled = true; $("gen").textContent = t("generating"); $("gen").classList.add("gen-busy");
  const { data, error } = await sb.functions.invoke("tts", { body: { text, lang, voice: $("cloudVoice").value } });
  $("gen").textContent = t("gen"); $("gen").classList.remove("gen-busy"); updateNotes();
  if (error || !data || !data.path) { toast(t("err") + (error ? error.message : "no audio"), true); return false; }
  cloudPath = data.path; $("dl").hidden = false;
  const p = $("preview"); p.src = sb.storage.from("episodes").getPublicUrl(data.path).data.publicUrl; p.hidden = false; toast(""); return true;
}
function setSession(s) {
  session = s; $("signOut").hidden = !s; $("loginForm").querySelectorAll("label").forEach(l => l.hidden = !!s);
  $("loginForm").querySelector("[type=submit]").hidden = !!s; updateNotes();
}

/* ── init ── */
function init() {
  Object.entries(LANGS).forEach(([k, v]) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.l = k; b.textContent = v.name; b.lang = k;
    b.onclick = () => setLang(k); $("langs").appendChild(b);
  });
  for (let i = 0; i < 28; i++) { const s = document.createElement("span"); s.style.animationDelay = (-(i * 0.37) % 0.9).toFixed(2) + "s"; s.style.animationDuration = (0.5 + (i * 7 % 6) / 10) + "s"; $("meter").appendChild(s); }

  const saved = store.get("sawt.lang"), nav = (navigator.language || "ar").slice(0, 2);
  lang = LANGS[saved] ? saved : (LANGS[nav] ? nav : "ar");

  $("text").addEventListener("input", () => { touched = true; updateCount(); });
  $("rate").oninput = e => $("rateV").textContent = (+e.target.value).toFixed(1) + "×";
  $("pitch").oninput = e => $("pitchV").textContent = (+e.target.value).toFixed(1);
  $("play").onclick = async () => {
    if (voices.length || !window.speechSynthesis) return say($("text").value);
    // no browser voice for this language (typical for Arabic): use the cloud MP3 voice
    if (!sb || !session) return toast(t("needCloud"), true);
    if (await generateMp3()) { const p = $("preview"); p.hidden = false; p.play().catch(() => {}); }
  };
  $("pause").onclick = () => { if (speechSynthesis.paused) { speechSynthesis.resume(); $("pause").textContent = t("pause"); } else { speechSynthesis.pause(); $("pause").textContent = t("resume"); } };
  $("stop").onclick = stopSpeech;
  $("save").onclick = saveEpisode; $("gen").onclick = generateMp3; $("dl").onclick = downloadMp3;
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = fillVoices;

  const live = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase;
  if (live) {
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    $("admin").hidden = false;
    sb.auth.getSession().then(r => setSession(r.data.session));
    sb.auth.onAuthStateChange((_e, s) => setSession(s));
    $("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
      if (error) toast(t("err") + error.message, true);
    });
    $("signOut").onclick = () => sb.auth.signOut();
  } else $("demoBanner").hidden = false;

  applyLang(); loadEpisodes(); loadOverrides();
}
init();
</script>
